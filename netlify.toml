[build]
  command = "npm run build"
  publish = "build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Never cache the HTML shell — it points to the current hashed bundles.
# This is what forces devices to pick up new deploys without a hard reload.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Hashed build assets change filename every deploy, so cache them forever.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The manifest can change (icons, name); keep it fresh.
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"